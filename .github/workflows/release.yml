name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - run: |
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            make CC="zig cc -target $target"
            mv blind blind-$target
          done

      - run: gh release create "$GITHUB_REF_NAME" blind-* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
